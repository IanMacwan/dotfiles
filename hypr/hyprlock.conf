# ~/.config/hypr/hyprlock.conf

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 1
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/.config/imgs/bg/desktop.jpg
    blur_passes = 3
    blur_size = 3
    contrast = 1.15
    brightness = 0.3
    vibrancy = 0.05
    noise = 0.04
}

# ── TTY header (top-left, like getty's banner) ─────────────
label {
    monitor =
    text = cmd[update:60000] echo "Arch Linux $(uname -r) (tty1)"
    color = rgba(146, 131, 116, 1.0)        # gruvbox gray
    font_size = 13
    font_family = Terminess Nerd Font
    position = 30, -25
    halign = left
    valign = top
}

# ── Thin frame around the login area ───────────────────────
shape {
    monitor =
    size = 520, 230
    color = rgba(29, 32, 33, 0.55)          # bg0_h, see-through
    rounding = 0
    border_size = 1
    border_color = rgba(146, 131, 116, 0.9)
    position = 0, 43
    halign = center
    valign = center
}

# ── Clock glow (dim offset copy) ───────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(184, 187, 38, 0.30)
    font_size = 72
    font_family = Terminess Nerd Font
    position = 3, 83
    halign = center
    valign = center
}

# ── Clock ──────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(184, 187, 38, 1.0)
    font_size = 72
    font_family = Terminess Nerd Font
    position = 0, 86
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%a %b %d %Y")"
    color = rgba(146, 131, 116, 1.0)
    font_size = 14
    font_family = Terminess Nerd Font
    position = 0, 32
    halign = center
    valign = center
}

# ── Password line ──────────────────────────────────────────
input-field {
    monitor =
    size = 360, 30
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    font_color = rgb(184, 187, 38)

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_text_format = *                    # needs recent hyprlock; delete if it errors
    rounding = 0

    check_color = rgb(250, 189, 47)
    fail_color = rgb(251, 73, 52)           # gruvbox red
    fail_text = Login incorrect [$ATTEMPTS]
    capslock_color = rgb(254, 128, 25)

    fade_on_empty = false
    placeholder_text = Password:
    font_family = Terminess Nerd Font

    position = 0, -10
    halign = center
    valign = center
}

# ── Random login message ───────────────────────────────────
label {
    monitor =
    text = cmd[update:3600000] printf '%s\n' "welcome back, $USER" "$USER detected. identity unverified." "[ OK ] session held for $USER" "the machine remembers you, $USER" "system idle. awaiting operator." "hello, $USER. shall we play a game?" "access restricted. proceed with caution." "no one has touched this terminal since you left" "$USER@archlinux: you were missed" | shuf -n1
    color = rgba(168, 153, 132, 1.0)        # gruvbox fg4
    font_size = 13
    font_family = Terminess Nerd Font
    position = 0, -50
    halign = center
    valign = center
}

# ── Boot-style status (bottom-left) ────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo -e "[  OK  ] Session locked\n[  OK  ] Uptime: $(uptime -p | sed 's/up //')"
    color = rgba(184, 187, 38, 0.75)
    font_size = 12
    font_family = Terminess Nerd Font
    text_align = left
    position = 30, 25
    halign = left
    valign = bottom
}

background {
    monitor =
    path = ~/.config/imgs/bg/desktop.jpg
    blur_passes = 2
    contrast = 1.1
    brightness = 0.55
    vibrancy = 0.3
    vibrancy_darkness = 0.25
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 460, 40
    outline_thickness = 0

    dots_size = 0.18
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.15)

    font_color = rgb(184, 187, 38)
    rounding = 0

    fade_on_empty = false
    placeholder_text = pass 

    font_family = Terminess Nerd Font
    hide_input = false

    position = 0, -35
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$USER@archlinux:~"
    color = rgba(235, 219, 178, 0.9)
    font_size = 20
    font_family = Terminess Nerd Font

    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(250, 189, 47, 0.8)
    font_size = 20
    font_family = Terminess Nerd Font

    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date +"%Y-%m-%d")"
    color = rgba(235, 219, 178, 0.6)
    font_size = 15
    font_family = Terminess Nerd Font

    position = 0, 75
    halign = center
    valign = center
}
